<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#12161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FIZZY">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FIZZY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#12161c;--ink2:#1a2029;--ink3:#232b36;--line:#2e3742;--paper:#e8e4da;
--muted:#8b96a5;--amber:#f0a028;--amber-soft:#8a6a3a;--green:#5fd39a;--yellow:#e3c045;--red:#e2685f;--blue:#6aa8e8;--r:14px}
body.light{--ink:#f2efe7;--ink2:#fff;--ink3:#e9e4d8;--line:#d3ccbc;--paper:#1a1a18;
--muted:#7d7668;--amber:#b8690a;--green:#2f9b6b;--yellow:#a8850c;--red:#c8443c;--blue:#2f6fb0}
body.light .big{background:#1a2029;color:#e8e4da}
body.light .big s{color:#8b96a5}
body.light .chip.on{background:#1a2029;color:#f2efe7;border-color:#1a2029}
body.light #bnav{background:rgba(242,239,231,.95)}
body.light .act{color:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:none}
body{background:var(--ink);color:var(--paper);font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;
font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2{font-family:'Archivo',system-ui,sans-serif;letter-spacing:-.01em;margin:0}
input,select,button{font-family:inherit;font-size:16px;color:var(--paper)}
.hide{display:none!important}
.num{font-variant-numeric:tabular-nums}
svg{display:block}

#lock{position:fixed;inset:0;background:var(--ink);display:flex;flex-direction:column;align-items:center;
justify-content:center;z-index:200;padding:24px}
#lock .brand{font-family:'Archivo';font-weight:800;font-size:34px;letter-spacing:.22em;color:var(--amber);margin-bottom:32px}
.dots{display:flex;gap:14px;margin-bottom:30px}
.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line)}
.dot.on{background:var(--amber);border-color:var(--amber)}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:15px}
.key{height:74px;border-radius:50%;background:var(--ink2);border:1px solid var(--line);font-size:25px;
cursor:pointer;display:flex;align-items:center;justify-content:center}
.key:active{background:var(--ink3)}.key.blank{background:none;border:none}
#lock.bad .dots{animation:sh .35s}@keyframes sh{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}

header{position:sticky;top:0;z-index:30;background:var(--ink);padding:11px 16px 9px;
display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
header .lg{font-family:'Archivo';font-weight:800;font-size:17px;letter-spacing:.2em}
header .rt{display:flex;align-items:center;gap:14px}
.led{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.led.ok{background:var(--green)}.led.err{background:var(--red)}.led.busy{background:var(--amber)}
.ico{background:none;border:none;padding:0;cursor:pointer;color:var(--muted)}
main{padding:16px 16px 96px;max-width:620px;margin:0 auto}
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(18,22,28,.95);
backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#bnav button{flex:1;background:none;border:none;padding:10px 0 12px;color:var(--muted);
font-size:11px;letter-spacing:.1em;cursor:pointer;position:relative;
display:flex;flex-direction:column;align-items:center;gap:3px}
#bnav button.on{color:var(--paper)}
#bnav button svg{opacity:.7}#bnav button.on svg{opacity:1}
.badge{position:absolute;top:4px;right:50%;transform:translateX(24px);background:var(--red);opacity:.85;color:#fff;
font-size:10px;font-weight:600;border-radius:9px;padding:0 6px;line-height:1.6}

.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.hd h2{font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.q{background:none;border:1px solid var(--line);color:var(--muted);border-radius:50%;
width:22px;height:22px;font-size:12px;cursor:pointer;padding:0}
.help{color:var(--muted);font-size:12px;line-height:1.6;margin:0 0 12px;padding:10px 12px;
background:var(--ink3);border-radius:10px}
label{display:block;margin-bottom:11px}
label>span{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;margin-bottom:5px}
input[type=text],input[type=number],input[type=password],select{width:100%;padding:11px 12px;
background:var(--ink);border:1px solid var(--line);border-radius:10px;outline:none}
body.light input,body.light select{background:var(--ink3)}
input:focus,select:focus{border-color:var(--amber)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 8px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.segbar{display:flex;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:10px;gap:3px}
.segb{flex:1;padding:8px 6px;border:none;background:none;color:var(--muted);font-size:13px;border-radius:8px;
display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.segb.on{background:var(--paper);color:var(--ink);font-weight:600}
.chkline{display:flex;align-items:center;gap:10px;padding:9px 2px;font-size:13.5px;cursor:pointer}
.chkrow{display:flex;gap:14px;flex-wrap:wrap;padding:6px 2px 12px}
.setblk{background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:14px}
.setttl{display:flex;align-items:center;gap:9px;font-family:'Archivo';font-weight:700;font-size:14px;
margin-bottom:13px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.setttl .q{margin-left:auto}
.readout{padding:11px 12px;background:var(--ink3);border:1px solid var(--line);border-radius:10px;
font-family:'Archivo';font-weight:700;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:6px 2px;font-size:13.5px;
border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted)}
.kv .v{font-family:'Archivo';font-weight:700;font-variant-numeric:tabular-nums}
.kv.big .v{font-size:19px}
.verdict{padding:11px 2px 2px;text-align:center;font-weight:600;font-size:13.5px}
.verdict.ok{color:var(--green)}
.verdict.no{color:var(--red)}
.chkitem{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;color:var(--muted)}
.dedrow{display:flex;align-items:center;gap:12px;padding:13px;margin-bottom:7px;border-radius:11px;
background:var(--ink2);border:1px solid var(--line);cursor:pointer}
.dedrow.on{border-color:var(--amber)}
.dedrow .cbx{width:24px;height:24px;flex:0 0 24px}
.dedrow .dn{flex:1;font-size:14px}
.dedrow .dv{font-family:'Archivo';font-weight:700;font-size:14px;color:var(--muted)}
.dedrow.on .dv{color:var(--paper)}
.dedrow .dv.neg{color:var(--red)}
#devSub .chkitem{padding:6px 0}
.chip{padding:8px 13px;border-radius:99px;background:var(--ink2);border:1px solid var(--line);
color:var(--muted);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:600}
.act{width:100%;padding:14px;border:none;border-radius:11px;background:var(--amber);color:#1a1200;
font-family:'Archivo';font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;
cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.act:active{filter:brightness(.9)}
.act.ready{animation:actPulse 1.8s ease-in-out infinite}
@keyframes actPulse{0%,100%{box-shadow:0 0 0 0 rgba(240,160,40,.45)}50%{box-shadow:0 0 0 7px rgba(240,160,40,0)}}
a.act{text-decoration:none}
.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.sm{width:auto;padding:8px 12px;font-size:12px;border-radius:9px;text-transform:none;letter-spacing:0}
.rowbtn{display:flex;gap:8px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.tile{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:12px;
text-align:left;cursor:pointer;position:relative}
.tile:active{background:var(--ink3)}
.tile b{display:block;font-family:'Archivo';font-size:15px;font-weight:700;margin-bottom:4px;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:30px}
.tile s{display:block;text-decoration:none;font-size:12px;color:var(--muted)}
.tile.out{opacity:.4}
.tile .inc{position:absolute;top:10px;right:10px;background:var(--amber-soft);color:#f2e6d0;font-size:11px;
font-weight:700;border-radius:9px;padding:0 7px;line-height:1.7}
.bar{height:3px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px}
.segbar2{display:flex;gap:2px;margin-top:8px}
.segbar2 i{flex:1;height:5px;border-radius:1px;background:var(--line)}
.segbar2 i.on{background:var(--seg,var(--green))}
.dotc{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--ink2);
border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:8px;cursor:pointer;
width:100%;text-align:left;gap:10px}
.row:active{background:var(--ink3)}
.row.out{opacity:.4}
.row b{font-family:'Archivo';font-weight:700;font-size:15px;display:block;overflow:hidden;
text-overflow:ellipsis;white-space:nowrap}
.row s{text-decoration:none;font-size:12px;color:var(--muted)}
.row .rr{display:flex;align-items:center;gap:9px;color:var(--muted)}
.vline{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.vline .nm{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.vline .qt{font-family:'Archivo';font-weight:700;font-variant-numeric:tabular-nums}

.list .it{display:flex;justify-content:space-between;align-items:center;padding:12px 13px;
border-bottom:1px solid var(--line);cursor:pointer;gap:10px}
.list .it:active{background:var(--ink2)}
.list{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list .it:last-child{border-bottom:none}
.it .lf{display:flex;align-items:center;gap:10px;min-width:0}
.it .dt{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who{font-family:'Archivo';font-weight:700;font-size:14.5px;color:var(--paper);letter-spacing:-.01em}
.whoSub{font-size:11px;color:var(--muted);margin-left:7px;font-family:'IBM Plex Mono'}
.it .lf{flex:1;min-width:0}.it .lf+.lf{flex:0 0 auto}
.it .am{font-family:'Archivo';font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.it .am.neg{color:var(--amber)}.it .am.wait{color:var(--red)}
.it.st-sale{border-left-color:var(--green)}
.it.st-debt{border-left-color:var(--red)}
.it.st-ret{border-left-color:var(--amber)}
.it.st-gift{border-left-color:var(--blue)}
.it.st-move{border-left-color:var(--muted)}
.cbx{width:21px;height:21px;border-radius:6px;border:1.5px solid var(--line);flex:0 0 21px;
display:flex;align-items:center;justify-content:center;background:var(--ink2)}
.cbx.on{background:var(--amber);border-color:var(--amber);color:#1a1200}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 12px;
border:1px dashed var(--line);border-radius:var(--r)}
.empty svg{opacity:.35;margin-bottom:8px}
.h3{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin:22px 0 9px}

.big{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:18px;margin-bottom:12px}
.big s{display:block;text-decoration:none;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#59544a}
.big{position:relative;overflow:hidden}
.big::before{content:'';position:absolute;top:0;left:0;right:0;height:60px;
  background:linear-gradient(180deg,rgba(255,255,255,.35),transparent);pointer-events:none}
.big b{font-family:'Archivo';font-size:36px;font-weight:800;line-height:1.15;transition:color .25s}
.big b.neg2{color:var(--red)}
.env{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:8px}
.env .e1{display:flex;justify-content:space-between;align-items:center}
.env .nm{display:flex;align-items:center;gap:9px;font-size:13.5px}
.env .v{font-family:'Archivo';font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.env .v.neg{color:var(--red)}
.env .sub{display:flex;gap:16px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);
font-size:12px;color:var(--muted);flex-wrap:wrap}
.statrow{display:flex;gap:14px;align-items:flex-start;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.stat{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.stat s{text-decoration:none;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.stat b{font-family:'Archivo';font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.env .sub span b{color:var(--paper);font-weight:600;font-family:'IBM Plex Mono'}
.tier,.vedit{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;margin-bottom:7px}
.tier input,.vedit input{padding:9px 10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:400}
th:first-child,td:first-child{text-align:left}
td.pos{color:var(--green)}td.neg{color:var(--red)}

#sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;
background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .22s}
#sheet.on{opacity:1;pointer-events:auto}
#sheetBox{background:var(--ink);border-radius:20px 20px 0 0;border-top:1px solid var(--line);width:100%;
max-width:620px;max-height:93vh;overflow-y:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom));
transform:translateY(100%);transition:transform .26s cubic-bezier(.22,.85,.3,1)}
#sheet.on #sheetBox{transform:none}
.grabBtn{display:block;width:100%;background:none;border:none;padding:10px 0 14px;cursor:pointer}
.grab{display:block;width:44px;height:5px;background:var(--line);border-radius:3px;margin:0 auto}
.grabBtn:active .grab{background:var(--muted)}
.closeBtn{margin-top:4px}
.step{display:flex;align-items:center;gap:16px;justify-content:center;margin:10px 0}
.step button{width:56px;height:56px;border-radius:50%;background:var(--ink2);border:1px solid var(--line);
font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.step .n{font-family:'Archivo';font-weight:800;font-size:34px;width:110px;text-align:center;
background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;color:var(--paper)}
.step .n::-webkit-outer-spin-button,.step .n::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pv{text-align:center;font-size:13px;color:var(--muted);margin-bottom:16px}
.pv b{color:var(--paper);font-family:'Archivo';font-size:18px}
.rc{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:12px}
.rc .ln{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;font-size:13.5px}
.rc .tot{border-top:1px dashed var(--line);margin-top:8px;padding-top:9px;font-weight:600;font-size:15px}
#dlg{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;
padding:28px;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .16s}
#dlg.on{opacity:1;pointer-events:auto}
.dlgbox{background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:20px;
max-width:340px;width:100%;transform:scale(.96);transition:transform .16s}
#dlg.on .dlgbox{transform:none}
.dlgbox p{margin:0 0 18px;font-size:14.5px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--paper);color:var(--ink);
padding:11px 16px;border-radius:99px;font-size:13px;font-weight:500;z-index:90;opacity:0;transition:opacity .2s;
pointer-events:none;max-width:90%;display:flex;align-items:center;gap:12px}
.toast.on{opacity:1;pointer-events:auto}
.toast button{background:none;border:none;color:#a3661a;font-weight:700;font-size:13px;cursor:pointer;padding:0}
</style>
</head>
<body>

<div id="lock">
  <div class="brand">FIZZY</div>
  <div class="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
  <div class="pad" id="pad"></div>
</div>

<div id="app" class="hide">
<header>
  <span class="lg">FIZZY</span>
  <span class="rt"><i class="led" id="led"></i>
    <button class="ico" id="btnSet" onclick="openSettings()"></button>
    <button class="ico" id="btnLock" onclick="lockNow()"></button></span>
</header>

<main>
<section id="v-sell">
  <button class="act" id="btnNew" onclick="newReceipt()">Новый чек</button>
  <div id="holdBox"></div>
  <div id="routeBtnBox"></div>
  <div id="s_hd"></div>
  <div id="s_list"></div>
</section>

<section id="v-money" class="hide">
  <div class="big"><s>всего в банке</s><b id="bankTotal" class="num">0 €</b>
    <div style="font-size:12px;color:#59544a;margin-top:3px" id="bankSub"></div></div>
  <div id="envs"></div>
  <div style="height:10px"></div>
  <div class="rowbtn">
    <button class="act ghost" id="btnDeduct" onclick="openDeduct()">Вычет</button>
    <button class="act ghost" id="btnCalc" onclick="openCalc()">Калькулятор</button>
    <button class="act ghost" id="btnReport" onclick="openReport()">Отчёт</button></div>
  <div id="debtsBox"></div>
  <div id="planBox"></div>
  <div id="m_hd"></div>
  <div id="m_list"></div>
</section>

<section id="v-stock" class="hide">
  <div class="rowbtn">
    <button class="act" id="btnBatch" onclick="openBuy()">Партия</button>
    <button class="act ghost" id="btnPos" onclick="openNewProduct()">Позиция</button></div>
  <div id="orderBox"></div>
  <div id="lowBox"></div>
  <div id="p_hd"></div>
  <div id="p_list"></div>
</section>
</main>

<nav id="bnav">
  <button class="on" onclick="show('sell')"><span id="ic0"></span>Касса</button>
  <button onclick="show('money')"><span id="ic1"></span>Банк<span class="badge hide" id="debtBadge"></span></button>
  <button onclick="show('stock')"><span id="ic2"></span>Склад</button>
</nav>
</div>

<div id="sheet" onclick="if(event.target===this)closeSheet()"><div id="sheetBox"></div></div>
<div id="dlg"><div class="dlgbox" id="dlgBox"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const $=i=>document.getElementById(i);
const num=i=>{const e=$(i);if(!e)return 0;const v=parseFloat(String(e.value).replace(',','.'));return isNaN(v)?0:v};
function fmtNum(n){
  const neg=n<0;n=Math.abs(n);
  const s2=n.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/\s/g,'\u2009');
  return(neg?'\u2212':'')+s2}
const eur=n=>fmtNum(Math.round((n||0)*100)/100)+' €';

const today=()=>new Date().toISOString().slice(0,10);
const fmtD=s=>s?s.split('-').reverse().join('.'):'';
const MON=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const uid=()=>Date.now()+Math.floor(Math.random()*1000);
const esc=s=>String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const mem={};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},
             set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};

/* ---------- иконки ---------- */
const sv=(d,s)=>`<svg width="${s||20}" height="${s||20}" viewBox="0 0 24 24" fill="none"

/* ---------- модель ---------- */
function norm(){
  if(!data.holds)data.holds=[];
  data.products.forEach(p=>{
    if(!p.variants||!p.variants.length)p.variants=[{id:uid(),name:'',stock:p.stock||0,lastQty:p.lastQty||0}];
    p.variants.forEach(v=>{v.stock=v.stock||0;v.lastQty=v.lastQty||0});
    if(!p.tiers||!p.tiers.length)p.tiers=[{from:1,price:0}];
    p.tiers.sort((a,b)=>a.from-b.from)})}
const P=id=>data.products.find(x=>x.id==id);
const V=(p,id)=>p&&p.variants.find(x=>x.id==id);
const stockOf=p=>p.variants.reduce((a,v)=>a+(v.stock||0),0);
function reservedOf(vid){let q=0;
  (data.holds||[]).forEach(h=>{if(R&&R.editing&&h.id===R.editing)return;
    (h.items||[]).forEach(l=>{if(l.vid==vid)q+=l.qty})});return q}
const availOf=v=>(v.stock||0)-reservedOf(v.id);
const availP=p=>p.variants.reduce((a,v)=>a+availOf(v),0);
const reservedP=p=>p.variants.reduce((a,v)=>a+reservedOf(v.id),0);
function fill(v){if(v.minStock)return v.stock<=v.minStock?0:Math.min(1,(v.stock-v.minStock)/(Math.max(1,v.lastQty||v.minStock*3)));
  if(!v.lastQty)return v.stock>0?1:0;return v.stock/v.lastQty}
function isLow(v){if(v.minStock)return v.stock<=v.minStock;return fill(v)*100<S().red}
function clr(v){if(v.minStock)return v.stock<=v.minStock?'var(--red)':(v.stock<=v.minStock*2?'var(--yellow)':'var(--green)');
  const f=fill(v)*100;return f>=S().green?'var(--green)':f>=S().red?'var(--yellow)':'var(--red)'}
function pFill(p){const t=p.variants.reduce((a,v)=>a+(v.lastQty||0),0);
  return t?stockOf(p)/t:(stockOf(p)>0?1:0)}
function pClr(p){const f=pFill(p)*100;return f>=S().green?'var(--green)':f>=S().red?'var(--yellow)':'var(--red)'}
const multi=p=>p.variants.length>1||!!p.variants[0].name;
function priceFor(p,q){const t=p.tiers.filter(x=>q>=x.from).sort((a,b)=>b.from-a.from)[0];
  return t?t.price:p.tiers[0].price}
function rQtyOf(pid,extra){return R.items.reduce((a,l)=>a+(l.pid==pid?l.qty:0),0)+(extra||0)}
function linePrice(l){if(!l.pid)return l.price||0;
  const p=P(l.pid);return p?priceFor(p,rQtyOf(l.pid)):0}
const fuelC=(km,c,p)=>km/100*c*p;
function road(s){if(s.deliv!=='delivery'||s.trans!=='car')return 0;
  const c=s.cons||S().cons,f=s.fp||S().fp;
  return (fuelC(s.km||0,c,f)+(s.other||0))*(1+S().err/100)}
function T(s){const r=road(s),fee=s.fee||0,k=S();
  const goods=(s.total||0)-fee;
  const profit=goods-(s.cost||0)-r;
  const car=profit*k.car/100+fee;
  return{r,fee,profit:profit+fee,car,dev:profit*k.dev/100,pocket:profit*k.pocket/100,
    fuel:car*k.fuel/100,repair:car*k.repair/100}}
function buyT(v){const k=S(),f=fuelC(v.km,v.cons||k.cons,v.fp||k.fp),d=v.km*k.dep;
  const total=(v.goods+f+d+(v.trip||0))*(1+k.err/100)*(1+k.inf/100);
  return{f,d,total,unit:v.qty?total/v.qty:0}}
function frozen(){return data.products.reduce((a,p)=>a+stockOf(p)*(p.cost||0),0)}
function canAfford(sum){
  const{b}=bank();
  const avail=b.turnover+(S().planDev?b.dev:0);
  return{ok:avail>=sum,gap:Math.max(0,sum-avail),avail}}
function onTheWay(){return data.purchases.filter(p=>p.ordered).reduce((a,p)=>a+p.total,0)}
function toPayLater(){return data.purchases.filter(p=>p.ordered&&!p.paid).reduce((a,p)=>a+p.total,0)}
function bank(){
  const b={turnover:0,fuel:0,repair:0,dev:0,pocket:0};let debt=0;
  data.sales.forEach(s=>{
    const t=T(s);
    if(s.kind==='gift'){b.fuel-=t.r;return}
    if(s.debt&&!s.paid){debt+=s.total;return}
    b.turnover+=s.cost;b.dev+=t.dev;b.pocket+=t.pocket;b.fuel+=t.fuel;b.repair+=t.repair});
  data.purchases.forEach(p=>{if(!p.ordered||p.paid)b.turnover-=p.total});
  data.expenses.forEach(e=>b[e.env]-=e.amount);
  const cap=S().devCap;
  if(cap>0&&b.dev>cap){b.pocket+=(b.dev-cap);b.dev=cap}
  return{b,debt,total:b.turnover+b.fuel+b.repair+b.dev+b.pocket}}

let animTimers={};
function animateNum(id,target,round){
  const el=$(id);if(!el)return;
  const from=parseFloat(el.dataset.v||target);
  clearInterval(animTimers[id]);
  const dur=380,t0=performance.now();
  animTimers[id]=setInterval(()=>{
    const p=Math.min(1,(performance.now()-t0)/dur);
    const v=from+(target-from)*(1-Math.pow(1-p,3));
    el.textContent=round?fmtNum(Math.round(v/round)*round)+' €':eur(v);
    if(p>=1){clearInterval(animTimers[id]);el.dataset.v=target}
  },16)}
function sheet(h){
  $('sheetBox').innerHTML='<button class="grabBtn" onclick="closeSheet()"><span class="grab"></span></button>'+h+
    '<div style="height:8px"></div><button class="act ghost closeBtn" onclick="closeSheet()">Закрыть</button>';
  $('sheet').classList.add('on');$('sheetBox').scrollTop=0;initSheetSwipe()}
let swipeY=0,swiping=false;
function initSheetSwipe(){
  const box=$('sheetBox');
  box.ontouchstart=e=>{if(box.scrollTop>0)return;swipeY=e.touches[0].clientY;swiping=true};
  box.ontouchmove=e=>{if(!swiping)return;
    const d=e.touches[0].clientY-swipeY;
    if(d>0){box.style.transform='translateY('+d+'px)';box.style.transition='none'}};
  box.ontouchend=e=>{if(!swiping)return;swiping=false;
    const d=(e.changedTouches[0].clientY-swipeY);
    box.style.transition='';
    if(d>90){closeSheet()}else{box.style.transform=''}}}
function closeSheet(){const b=$('sheetBox');b.style.transform='';$('sheet').classList.remove('on')}

function newReceipt(hold){
  R=hold?{items:hold.items.map(l=>Object.assign({},l)),deliv:hold.deliv||'pickup',trans:hold.trans||'car',
      kind:hold.kind||'sale',debt:!!hold.debt,note:hold.note||'',km:hold.km||0,other:0,addr:hold.addr||'',
      deliv2fee:!!hold.deliv2fee,fee:hold.fee||0,
      cons:hold.cons||S().cons,fp:hold.fp||S().fp,editing:hold.id}
    :{items:[],deliv:'pickup',trans:'car',kind:'sale',debt:false,note:'',km:0,other:0,addr:'',
      cons:S().cons,fp:S().fp,deliv2fee:false,fee:0,editing:null};
  drawReceipt()}
function drawReceipt(){
  sheet(`<div class="hd"><h2>Чек</h2><button class="ico" onclick="closeSheet()">${I.back()}</button></div>
   <div class="tiles" id="rcTiles"></div>
   <div id="rcBody"></div>`);

    return `<button class="tile${st<=0?' out':''}" onclick="rcPick(${p.id})">
      ${inC?`<span class="inc">${inC}</span>`:''}<b>${esc(p.name)}</b>

      <div class="bar"><i style="width:${Math.min(100,pFill(p)*100)}%;background:${pClr(p)}"></i></div></button>`
  }).join(''):'<div class="empty" style="grid-column:1/-1">Нет позиций</div>';
  rcBody()}
function roundTo(v){const r=S().round||1;return Math.round(v/r)*r}
function groupLines(items,priceOf,delFn){
  const g=[];items.forEach((l,i)=>{let x=g.find(y=>y.name===l.name);
    if(!x){x={name:l.name,rows:[]};g.push(x)}x.rows.push({l,i})});
  return g.map(x=>`<div style="padding:5px 0">
    <div style="font-family:Archivo;font-weight:700;font-size:14px">${esc(x.name)}</div>
    ${x.rows.map(({l,i})=>`<div class="ln" style="padding:3px 0 0">
      <span style="color:var(--muted);font-size:12.5px">${l.vname?esc(l.vname):'основной'} × ${Math.abs(l.qty)}</span>
      <span class="num">${priceOf(l)}${delFn?delFn(i):''}</span></div>`).join('')}</div>`).join('')}
function rcTot(){let total=0,cost=0;
  R.items.forEach(l=>{total+=linePrice(l)*l.qty;cost+=l.cost*l.qty});
  if(R.deliv==='delivery'&&R.deliv2fee)total+=(R.fee||0);
  if(R.kind==='gift')total=0;
  return{total,cost}}
function rcBody(){

  $('rcBody').innerHTML=`
   ${R.items.length?`<div class="rc">${groupLines(R.items,
     l=>R.kind==='gift'?'—':eur(linePrice(l)*l.qty),

     <button class="segb${R.trans==='foot'?' on':''}" onclick="rcTrans('foot')">${I.walk(15)}Пешком</button></div>

       <span class="cbx${R.deliv2fee?' on':''}">${R.deliv2fee?I.check(13):''}</span>Доставка платная</span></div>`:''}`:''}
   ${R.deliv==='delivery'?`<label><span>Адрес</span>

   ${R.deliv==='delivery'&&R.trans==='car'?`<div class="g3">

       oninput="R.km=parseFloat(this.value)||0;rcRefresh()"></label>

      <span class="rr"><i class="dotc" style="background:${clr(v)}"></i>
      <span class="num" style="font-family:Archivo;font-weight:700">${av}</span></span></button>`}).join(''))}
function rcQty(pid,vid){
  const p=P(pid),v=V(p,vid);picked={pid,vid,q:1};
  sheet(`<div class="hd"><h2>${esc(p.name)}</h2><button class="ico" onclick="drawReceipt()">${I.back()}</button></div>
   <div style="text-align:center;color:var(--muted);font-size:12px">${v.name?esc(v.name)+' · ':''}доступно ${availOf(v)}${reservedOf(v.id)?' · в брони '+reservedOf(v.id):''}</div>

function qStep(d){picked.q=Math.max(1,picked.q+d);$('qN').value=picked.q;qPreview()}
function qType(){picked.q=Math.max(1,parseInt($('qN').value)||1);qPreview()}
function qPreview(){const p=P(picked.pid),inC=rQtyOf(p.id),tot=inC+picked.q,pr=priceFor(p,tot);
  $('qPv').innerHTML=R.kind==='gift'?'подарок':`<b>${eur(pr)}</b> × ${picked.q} = ${eur(pr*picked.q)}`+(inC?` · ступень ${tot}+`:'')}
function rcAdd(){

function rcHold(){
  if(!R.items.length)return toast('Чек пуст');
  snap();const{total}=rcTot();
  if(R.editing)data.holds=data.holds.filter(h=>h.id!==R.editing);
  data.holds.unshift({id:uid(),date:today(),items:R.items,deliv:R.deliv,trans:R.trans,kind:R.kind,
    debt:R.debt,note:R.note,km:R.km,cons:R.cons,fp:R.fp,addr:R.addr,
    deliv2fee:R.deliv2fee,fee:R.deliv2fee?(R.fee||0):0,total});
  closeSheet();save();render();toast('Забронировано',true)}
function rcCommit(){
  if(!R.items.length)return toast('Чек пуст');
  snap();commit(R);
  if(R.editing)data.holds=data.holds.filter(h=>h.id!==R.editing);
  closeSheet();save();render();toast(R.kind==='gift'?'Подарено':(R.debt?'В долг':'Продано'),true)}
function commit(r){
  const items=r.items.map(l=>({pid:l.pid,vid:l.vid,name:l.name,vname:l.vname,qty:l.qty,
    price:r.kind==='gift'?0:(l.pid?priceForCtx(r,l):l.price||0),cost:l.cost}));
  let total=r.kind==='gift'?0:items.reduce((a,l)=>a+l.price*l.qty,0);
  if(r.kind!=='gift'&&r.deliv==='delivery'&&r.deliv2fee)total+=(r.fee||0);
  const cost=items.reduce((a,l)=>a+l.cost*l.qty,0);
  data.sales.unshift({id:uid(),date:today(),items,total,cost,kind:r.kind||'sale',
    deliv:r.deliv,trans:r.trans,km:r.km,cons:r.cons||S().cons,fp:r.fp||S().fp,note:r.note||'',addr:r.addr||'',
    fee:r.deliv2fee?(r.fee||0):0,debt:!!r.debt&&r.kind!=='gift',paid:false});
  items.forEach(l=>{if(!l.pid)return;const p=P(l.pid),v=V(p,l.vid);if(v)v.stock-=l.qty})}
function priceForCtx(r,l){const p=P(l.pid);if(!p)return l.price||0;
  const q=r.items.reduce((a,x)=>a+(x.pid==l.pid?x.qty:0),0);return priceFor(p,q)}

    </span>`).join('')}
function togSel(id){

function commitSelected(){

     <tr><td>Авто</td><td class="num">${eur(t.car)}</td></tr>

function copyAddr(a){

function delSale(id){

   <label><span>шт.</span><input type="number" inputmode="numeric" id="rQty" value="1"></label>

function fillRVar(){const p=P($('rNew').value);if(!p||!$('rNVar'))return;
  $('rNVar').innerHTML=p.variants.map(v=>`<option value="${v.id}">${esc(v.name||'основной')} — ${v.stock}</option>`).join('')}
function retMode(m){$('rMode').value=m;$('rm-money').classList.toggle('on',m==='money');
  $('rm-swap').classList.toggle('on',m==='swap');$('rSwap').classList.toggle('hide',m!=='swap')}
function doReturn(){
  const s=data.sales.find(x=>x.id==$('rSid').value);if(!s)return;
  const l=s.items[parseInt($('rItem').value)],q=Math.min(num('rQty'),l.qty);
  if(q<=0)return toast('Нужно количество');
  const mode=$('rMode').value;snap();
  const b={id:uid(),date:today(),kind:'return',deliv:'pickup',trans:'foot',note:s.note||'',
    items:[{pid:l.pid,vid:l.vid,name:l.name,vname:l.vname,qty:-q,price:l.price,cost:l.cost}],
    total:-q*l.price,cost:-q*l.cost,debt:false,paid:false};
  if(l.pid){const p=P(l.pid),v=V(p,l.vid);if(v)v.stock+=q}
  if(mode==='swap'){
    const np=P($('rNew').value),nv=V(np,$('rNVar').value),nq=Math.max(1,num('rNQty'));
    if(np&&nv){const pr=priceFor(np,nq);
      b.items.push({pid:np.id,vid:nv.id,name:np.name,vname:nv.name,qty:nq,price:pr,cost:np.cost||0});
      b.total+=nq*pr;b.cost+=nq*(np.cost||0);nv.stock-=nq}}
  data.sales.unshift(b);closeSheet();save();render();
  toast(mode==='swap'?(b.total>=0?'Доплата '+eur(b.total):'Сдача '+eur(-b.total)):'Возврат '+eur(q*l.price),true)}

/* --- геокодирование и оптимизация объезда --- */
const geoCache={};
async function geocode(addr){
  if(geoCache[addr])return geoCache[addr];
  const saved=store.get('fz_geo');let all={};
  if(saved){try{all=JSON.parse(saved)}catch(e){}}
  if(all[addr]){geoCache[addr]=all[addr];return all[addr]}
  let pt=null,neterr=false;
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+
      encodeURIComponent(addr));
    if(r.ok){const j=await r.json();
      if(j.length)pt={lat:parseFloat(j[0].lat),lon:parseFloat(j[0].lon)}}
  }catch(e){neterr=true}
  if(!pt){
    try{
      const r2=await fetch('https://photon.komoot.io/api/?limit=1&q='+encodeURIComponent(addr));
      if(r2.ok){const j2=await r2.json();
        if(j2.features&&j2.features.length){const c=j2.features[0].geometry.coordinates;
          pt={lat:c[1],lon:c[0]};neterr=false}}
    }catch(e){neterr=true}}
  if(!pt)throw new Error(neterr?'НЕТСЕТИ':'НЕНАЙДЕН:'+addr);
  geoCache[addr]=pt;all[addr]=pt;store.set('fz_geo',JSON.stringify(all));
  return pt}
function dist(a,b){const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lon-a.lon)*Math.PI/180;
  const la=a.lat*Math.PI/180,lb=b.lat*Math.PI/180;
  const h=Math.sin(dLat/2)**2+Math.cos(la)*Math.cos(lb)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h))}
function routeLen(pts,home,back){
  let d=0,prev=home||pts[0];
  const seq=home?pts:pts.slice(1);
  seq.forEach(p=>{d+=dist(prev,p);prev=p});
  if(home&&back)d+=dist(prev,home);
  return d}
function optimize(pts,home,back){
  const n=pts.length;if(n<2)return pts.map((_,i)=>i);
  let order=[],used=new Array(n).fill(false),cur=home||pts[0];
  if(!home){order.push(0);used[0]=true;cur=pts[0]}
  for(let k=order.length;k<n;k++){
    let best=-1,bd=Infinity;
    for(let i=0;i<n;i++)if(!used[i]){const d=dist(cur,pts[i]);if(d<bd){bd=d;best=i}}
    order.push(best);used[best]=true;cur=pts[best]}
  const len=o=>routeLen(o.map(i=>pts[i]),home,back);
  let improved=true,guard=0;
  while(improved&&guard++<200){improved=false;
    for(let i=0;i<n-1;i++)for(let j=i+1;j<n;j++){
      const cand=order.slice(0,i).concat(order.slice(i,j+1).reverse(),order.slice(j+1));
      if(len(cand)<len(order)-0.001){order=cand;improved=true}}}
  return order}
let routeKm=0;
function routeStatus(msg,bad){const e=$('rtStatus');
  if(e)e.innerHTML=`<div class="help" style="color:${bad?'var(--red)':'var(--muted)'}">${esc(msg)}</div>`}
async function optimizeRoute(){
  const list=routeHolds();
  if(list.length<2)return toast('Нужно хотя бы две точки');
  if(location.protocol==='file:'){
    routeStatus('Файл открыт напрямую (file://) — браузер блокирует такие запросы к картам. Загрузите fizzy.html на GitHub Pages и откройте по https-ссылке, тогда оптимизация заработает.',1);
    return}
  const home=(S().home||'').trim();
  try{
    let hp=null;
    if(home){routeStatus('Ищу точку старта: '+home);hp=await geocode(home)}
    const pts=[];
    for(let i=0;i<list.length;i++){
      routeStatus('Ищу адрес '+(i+1)+' из '+list.length+': '+list[i].addr);
      pts.push(await geocode(list[i].addr));
      if(i<list.length-1)await new Promise(r=>setTimeout(r,1100))}
    const before=routeLen(pts,hp,S().back);
    const order=optimize(pts,hp,S().back);
    const after=routeLen(order.map(i=>pts[i]),hp,S().back);
    const sorted=order.map(i=>list[i]);
    const rest=data.holds.filter(h=>!list.includes(h));
    data.holds=sorted.concat(rest);
    routeKm=Math.round(after*1.25);
    save();render();drawRoute();
    routeStatus((before-after>0.5?'Порядок улучшен. ':'Порядок уже оптимальный. ')+
      'Прикидка по прямой ~'+routeKm+' км — это грубо. Точный километраж возьмите в Google Maps и впишите в кассе при разносе.')
  }catch(e){
    const m=String(e.message||'');
    if(m==='НЕТСЕТИ')routeStatus('Нет доступа к карте адресов. Проверьте интернет или воспользуйтесь запросом для Gemini.',1);
    else if(m.startsWith('НЕНАЙДЕН:'))routeStatus('Не распознан адрес: '+m.slice(9)+'. Уточните его — добавьте город и страну, например «Kajaani, Suomi».',1);
    else routeStatus('Не вышло построить: '+m,1)}}
function legSharesFor(list){
  const home=(S().home||'').trim();
  const hp=home&&geoCache[home]?geoCache[home]:null;
  const pts=list.map(h=>geoCache[h.addr]);
  if(pts.some(p=>!p))return list.map(()=>1/list.length);
  const legs=[];let prev=hp||pts[0];
  pts.forEach(p=>{legs.push(dist(prev,p));prev=p});
  if(hp&&S().back)legs[legs.length-1]+=dist(prev,hp);
  const sum=legs.reduce((a,x)=>a+x,0)||1;
  return legs.map(x=>x/sum)}
function applySelKm(){
  const ids=Object.keys(sel).filter(k=>sel[k]).map(Number);
  const list=data.holds.filter(h=>ids.includes(h.id)&&h.deliv==='delivery'&&h.addr);
  if(list.length<2)return;
  const total=num('selKm');if(!total)return toast('Укажите километраж');
  const sh=legSharesFor(list);
  snap();
  list.forEach((h,i)=>{h.km=Math.round(total*sh[i]*10)/10;h.trans='car'});
  save();render();toast('Километраж разнесён по '+list.length+' чекам',true)}

    if(take>0||isLast){out.push({env:k,amount:take});left-=take}});
  return out.filter(x=>x.amount>0)}

function receiveOrder(id){
  const v=data.purchases.find(x=>x.id===id);if(!v||!v.ordered)return;
  const p=P(v.pid);if(!p)return toast('Позиция удалена');
  ask('Партия прибыла? Товар поступит на склад.',()=>{
    snap();
    const prevQty=stockOf(p),prevCost=p.cost||0;
    p.cost=prevQty>0?(prevQty*prevCost+v.qty*v.unit)/(prevQty+v.qty):v.unit;
    if(v.items&&v.items.length){
      const done=[];
      v.items.forEach(it=>{

     return `<button class="row" onclick="repDays('${k}')">
       <span><b>${MON[+mo-1]} ${y}</b><s>оборот ${eur(m[k].r)}${delta!==null?` · <span style="color:${delta>=0?'var(--green)':'var(--red)'}">${delta>=0?'↑':'↓'} ${Math.abs(delta).toFixed(0)}%</span>`:''}</s></span>
       <span class="rr"><span class="num" style="font-family:Archivo;font-weight:700;color:${m[k].p<0?'var(--red)':'var(--green)'}">${eur(m[k].p)}</span></span></button>`
    }).join(''):'<div class="empty">Пока пусто</div>'}
   `)}
function repDays(k){
  const d={};
  data.sales.forEach(s=>{if(!s.date.startsWith(k)||(s.debt&&!s.paid))return;const t=T(s);
    d[s.date]=d[s.date]||{r:0,p:0};d[s.date].r+=s.total;d[s.date].p+=t.profit});
  data.expenses.forEach(e=>{if(!e.date.startsWith(k))return;d[e.date]=d[e.date]||{r:0,p:0};d[e.date].p-=e.amount});
  const ks=Object.keys(d).sort().reverse();
  const tr=ks.reduce((a,x)=>a+d[x].r,0),tp=ks.reduce((a,x)=>a+d[x].p,0);
  const[y,mo]=k.split('-');
  const dm={};
  data.sales.forEach(s=>{if(!s.date.startsWith(k)||!s.items)return;
    s.items.forEach(l=>{if(l.qty<=0)return;const n=l.name+(l.vname?' · '+l.vname:'');
      dm[n]=dm[n]||{q:0,p:0};dm[n].q+=l.qty;dm[n].p+=l.qty*(l.price-l.cost)})});
  const dmk=Object.keys(dm).sort((a,b)=>dm[b].q-dm[a].q).slice(0,10);
  const wk=[{lbl:'1—7',r:0,p:0,n:0},{lbl:'8—14',r:0,p:0,n:0},{lbl:'15—21',r:0,p:0,n:0},
            {lbl:'22—28',r:0,p:0,n:0},{lbl:'29—31',r:0,p:0,n:0}];
  const wi=dt=>Math.min(4,Math.floor((parseInt(dt.slice(8,10))-1)/7));
  ks.forEach(x=>{const w=wk[wi(x)];w.r+=d[x].r;w.p+=d[x].p;w.n++});
  const dmx=dmk.length?dm[dmk[0]].q:1;
  sheet(`<div class="hd"><h2>${MON[+mo-1]} ${y}</h2><button class="ico" onclick="openReport()">${I.back()}</button></div>
   <div class="rc"><div class="ln"><span>Оборот</span><span class="num">${eur(tr)}</span></div>
    <div class="ln tot"><span>Прибыль</span><span class="num">${eur(tp)}</span></div></div>
   <div class="h3">Спрос за месяц</div>
   ${dmk.length?dmk.map(n=>`<div class="vline"><span class="nm">${esc(n)}</span>
     <span style="flex:0 0 90px"><span class="bar" style="margin:0"><i style="width:${dm[n].q/dmx*100}%;background:var(--amber)"></i></span></span>
     <span class="qt">${dm[n].q}</span></div>`).join(''):'<div class="empty">Нет продаж</div>'}
   <div class="h3">По неделям</div>
   <table><tr><th>Неделя</th><th>Оборот</th><th>Прибыль</th></tr>
   ${wk.map((w,i)=>w.n?`<tr><td>${w.lbl}</td><td class="num">${eur(w.r)}</td>
     <td class="num ${w.p<0?'neg':'pos'}">${eur(w.p)}</td></tr>`:'').join('')}
   <tr style="border-top:2px solid var(--line)"><td><b>Месяц</b></td>
     <td class="num"><b>${eur(tr)}</b></td><td class="num ${tp<0?'neg':'pos'}"><b>${eur(tp)}</b></td></tr></table>
   <div class="h3">По дням</div>
   <table><tr><th>День</th><th>Оборот</th><th>Прибыль</th></tr>
   ${ks.map(x=>`<tr><td>${fmtD(x).slice(0,5)}</td><td class="num">${eur(d[x].r)}</td>
     <td class="num ${d[x].p<0?'neg':'pos'}">${eur(d[x].p)}</td></tr>`).join('')}</table>`)}

function sparklineHtml(p){
  const days=14,vals=[];
  for(let i=days-1;i>=0;i--){
    const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10);
    let q=0;data.sales.forEach(s=>{if(s.date===d&&s.items)s.items.forEach(l=>{if(l.pid==p.id&&l.qty>0)q+=l.qty})});
    vals.push(q)}
  const mx=Math.max(1,...vals);
  const w2=260,h2=36,step=w2/(days-1);
  const pts=vals.map((v,i)=>`${(i*step).toFixed(1)},${(h2-2-(v/mx)*(h2-6)).toFixed(1)}`).join(' ');
  return `<div class="h3" style="margin-top:26px">Спрос за 14 дней</div>
   <svg width="100%" height="${h2}" viewBox="0 0 ${w2} ${h2}" preserveAspectRatio="none" style="display:block">
     <polyline points="${pts}" fill="none" stroke="var(--amber)" stroke-width="1.6"
       stroke-linejoin="round" stroke-linecap="round"/></svg>`}
function tierRow(t){return `<div class="tier">
  <input type="number" inputmode="numeric" class="tf" value="${t.from}" placeholder="от шт.">
  <input type="number" inputmode="decimal" class="tp" value="${t.price}" placeholder="€">
  <button class="ico" onclick="this.parentNode.remove()">${I.close(18)}</button></div>`}
function varRow(v){return `<div class="vedit" data-id="${v.id}" data-last="${v.lastQty||0}" style="grid-template-columns:1fr 1fr 1fr auto">
  <input type="text" class="vn" value="${esc(v.name||'')}" placeholder="название">
  <input type="number" inputmode="numeric" class="vs" value="${v.stock||0}" placeholder="шт.">
  <input type="number" inputmode="numeric" class="vm" value="${v.minStock||''}" placeholder="мин. шт.">
  <button class="ico" onclick="this.parentNode.remove()">${I.close(18)}</button></div>`}
function addTierRow(){$('tiers').insertAdjacentHTML('beforeend',tierRow({from:1,price:0}))}
function addVarRow(){$('vars').insertAdjacentHTML('beforeend',varRow({id:uid(),name:'',stock:0,lastQty:0}))}
function saveProduct(){

    price:parseFloat(String(r.querySelector('.tp').value).replace(',','.'))||0})).sort((a,b)=>a.from-b.from);
  if(!p.tiers.length)p.tiers=[{from:1,price:0}];
  const vs=[...document.querySelectorAll('#vars .vedit')].map(r=>({

  $('bQty').value=sum||'';bQtyLive()}
function bQtyLive(){
  if(bUnitGoods)$('bGoods').value=(num('bQty')*bUnitGoods).toFixed(2);
  bLive()}
function buyWay(w){bWay=w;
  $('bw-trip').classList.toggle('on',w==='trip');$('bw-post').classList.toggle('on',w==='post');
  $('bTripBox').classList.toggle('hide',w!=='trip');$('bPostBox').classList.toggle('hide',w!=='post');
  bLive()}
function buyInput(){return bWay==='post'
  ?{qty:num('bQty'),goods:num('bGoods'),km:0,trip:num('bPost'),cons:0,fp:0}
  :{qty:num('bQty'),goods:num('bGoods'),km:num('bKm'),trip:num('bTrip'),cons:num('bCons'),fp:num('bFp')}}
function bLive(){const t=buyT(buyInput());const bi=buyInput();
  $('bOut').innerHTML=`<div class="big" style="padding:16px;margin:10px 0"><s>за штуку</s><b>${eur(t.unit)}</b></div>

     товар ${eur(bi.goods)}${bi.km?' · топливо '+eur(t.f)+' · износ '+eur(t.d):''}${bi.trip?' · '+(bWay==='post'?'доставка':'в пути')+' '+eur(bi.trip):''} · итого партия ${eur(t.total)}</div>`}
function saveBuy(ordered){
  const q=num('bQty'),g=num('bGoods');if(!q||!g)return toast('Нужны штуки и сумма');
  snap();
  const p=P($('bProd').value);
  const bi=buyInput();
  const v={id:uid(),date:today(),pid:p.id,qty:q,goods:g,km:bi.km,trip:bi.trip,cons:bi.cons,fp:bi.fp,post:bWay==='post'};
  const t=buyT(v);v.total=t.total;v.unit=t.unit;v.name=p.name;
  if(ordered){
    v.ordered=true;v.paid=bPaid;
    if(multi(p)){const items=[];
      document.querySelectorAll('#bVarRows .tier').forEach(row=>{
        const qEl=row.querySelector('.bvq');const qty=parseFloat(qEl.value)||0;if(qty<=0)return;
        const vid=qEl.dataset.vid;const nameEl=row.querySelector('.bvn');
        items.push({vid:vid?parseInt(vid):null,newName:nameEl?nameEl.value.trim():'',qty})});
      v.items=items}
    data.purchases.unshift(v);closeSheet();save();render();
    return toast('Отложено, ждём прибытия',true)}
  const prevQty=stockOf(p),prevCost=p.cost||0;
  p.cost=prevQty>0?(prevQty*prevCost+q*t.unit)/(prevQty+q):t.unit;
  if(multi(p)){
    const items=[];
    document.querySelectorAll('#bVarRows .tier').forEach(row=>{
      const qEl=row.querySelector('.bvq');const qty=parseFloat(qEl.value)||0;if(qty<=0)return;
      const vid=qEl.dataset.vid;
      if(vid){items.push({vid:parseInt(vid),qty})}
      else{const nameEl=row.querySelector('.bvn');const name=nameEl?nameEl.value.trim():'';
        if(!name)return;const nv={id:uid(),name,stock:0,lastQty:0};p.variants.push(nv);
        items.push({vid:nv.id,qty})}});
    items.forEach(it=>{const vr=V(p,it.vid);if(vr){vr.stock+=it.qty;vr.lastQty=it.qty}});
    v.items=items.map(it=>({vid:it.vid,vname:(V(p,it.vid)||{}).name||'',qty:it.qty}));
  }else{
    const vr=p.variants[0];if(vr){vr.stock+=q;vr.lastQty=q;v.vname=vr.name;v.vid=vr.id}
  }
  data.purchases.unshift(v);closeSheet();save();render();toast(eur(t.unit)+' за штуку',true)}

function setTheme(l){data.settings.light=!!l;applyTheme();save();openSettings()}
function applyTheme(){document.body.classList.toggle('light',!!S().light)}
function saveSettings(){
  const s=num('kCar')+num('kDev')+num('kPk'),c=num('kFu')+num('kRp');
  if(Math.abs(s-100)>.01)return toast('Доли = '+s+'%, нужно 100');
  if(Math.abs(c-100)>.01)return toast('Топливо+ремонт = '+c+'%, нужно 100');
  snap();data.settings=Object.assign({},S(),{car:num('kCar'),dev:num('kDev'),pocket:num('kPk'),
    fuel:num('kFu'),repair:num('kRp'),err:num('kErr'),inf:num('kInf'),dep:num('kDep'),
    cons:num('kCons'),fp:num('kFp'),green:num('kGr'),red:num('kRd'),
    mGood:num('kMgood'),mOk:num('kMok'),round:parseInt($('kRound').value),
    goal:num('kGoal'),devCap:num('kDevCap'),home:$('kHome').value.trim(),dispRound:parseInt($('kDispR').value)});
  closeSheet();save();render();toast('Сохранено',true)}
function changePin(){
  const a=$('pin1').value.trim(),b=$('pin2').value.trim();
  if(!/^\d{4}$/.test(a))return toast('Нужны 4 цифры');
  if(a!==b)return toast('Не совпадает');
  ask('Сменить код на '+a+'?',()=>{data.settings.pin=a;save();
    $('pin1').value='';$('pin2').value='';toast('Код сменён')})}

function exportCsv(){
  const L=[],add=r=>L.push(r);
  let rev=0,prof=0,pk=0,gifts=0,rets=0;
  data.sales.forEach(s=>{const t=T(s);
    if(s.kind==='gift'){gifts+=s.cost;prof+=t.profit;return}
    if(s.kind==='return'){rets+=-s.total;rev+=s.total;prof+=t.profit;return}
    if(s.debt&&!s.paid)return;rev+=s.total;prof+=t.profit;pk+=t.pocket});
  const bought=data.purchases.reduce((a,p)=>a+p.total,0);
  const spent=data.expenses.reduce((a,e)=>a+e.amount,0);
  const{b,debt,total}=bank();
  const sales=data.sales.filter(s=>s.kind!=='gift'&&s.kind!=='return');
  add(['СВОДКА']);
  add(['Выгружено',new Date().toLocaleString('ru-RU')]);
  add(['Оборот',rev.toFixed(2)]);add(['Прибыль',prof.toFixed(2)]);
  add(['Чеков',sales.length]);
  add(['Средний чек',sales.length?(rev/sales.length).toFixed(2):'0']);
  add(['Подарено на',gifts.toFixed(2)]);add(['Возвращено',rets.toFixed(2)]);
  add(['Закуплено на',bought.toFixed(2)]);add(['Вычеты',spent.toFixed(2)]);
  add(['Заморожено в товаре',frozen().toFixed(2)]);
  add(['Ждём по долгам',debt.toFixed(2)]);
  add([]);add(['БАНК']);
  add(['Всего',total.toFixed(2)]);add(['На товар',b.turnover.toFixed(2)]);
  add(['Развитие',b.dev.toFixed(2)]);add(['Топливо',b.fuel.toFixed(2)]);
  add(['Ремонт',b.repair.toFixed(2)]);add(['Карман',b.pocket.toFixed(2)]);
  const m={};data.sales.forEach(s=>{if(s.debt&&!s.paid)return;const k=s.date.slice(0,7),t=T(s);
    m[k]=m[k]||{r:0,p:0,n:0};m[k].r+=s.total;m[k].p+=t.profit;if(s.kind!=='return')m[k].n++});
  data.expenses.forEach(e=>{const k=e.date.slice(0,7);m[k]=m[k]||{r:0,p:0,n:0};m[k].p-=e.amount});
  add([]);add(['ПО МЕСЯЦАМ']);add(['Месяц','Оборот','Прибыль','Чеков','Средний чек']);
  Object.keys(m).sort().reverse().forEach(k=>add([k,m[k].r.toFixed(2),m[k].p.toFixed(2),m[k].n,
    m[k].n?(m[k].r/m[k].n).toFixed(2):'0']));
  const d={};data.sales.forEach(s=>{if(s.debt&&!s.paid)return;const t=T(s);
    d[s.date]=d[s.date]||{r:0,p:0};d[s.date].r+=s.total;d[s.date].p+=t.profit});
  add([]);add(['ПО ДНЯМ']);add(['Дата','Оборот','Прибыль']);
  Object.keys(d).sort().reverse().forEach(k=>add([k,d[k].r.toFixed(2),d[k].p.toFixed(2)]));
  const dem={};data.sales.forEach(s=>s.items&&s.items.forEach(l=>{if(l.qty<=0)return;
    const k=l.name+(l.vname?' · '+l.vname:'');dem[k]=dem[k]||{q:0,r:0,p:0};
    dem[k].q+=l.qty;dem[k].r+=l.qty*l.price;dem[k].p+=l.qty*(l.price-l.cost)}));
  add([]);add(['СПРОС']);add(['Позиция','Штук','Выручка','Прибыль']);
  Object.keys(dem).sort((a,b)=>dem[b].q-dem[a].q).forEach(k=>
    add([k,dem[k].q,dem[k].r.toFixed(2),dem[k].p.toFixed(2)]));
  add([]);add(['СКЛАД']);add(['Позиция','Вариант','Остаток','Закупка','Заморожено','Цены']);
  data.products.forEach(p=>p.variants.forEach(v=>add([p.name,v.name||'основной',v.stock,
    (p.cost||0).toFixed(2),(v.stock*(p.cost||0)).toFixed(2),
    p.tiers.map(t=>'от '+t.from+' = '+t.price).join(' / ')])));
  add([]);add(['ПРОДАЖИ']);add(['Дата','Тип','Кому','Состав','Сумма','Закупка','Дорога','Прибыль','В карман','Оплачено']);
  data.sales.forEach(s=>{const t=T(s);add([s.date,
    s.kind==='gift'?'Подарок':s.kind==='return'?'Возврат':'Продажа',s.note||'',
    (s.items||[]).map(l=>l.name+(l.vname?' '+l.vname:'')+' x'+l.qty).join('; '),
    s.total.toFixed(2),s.cost.toFixed(2),t.r.toFixed(2),t.profit.toFixed(2),
    s.kind==='sale'?t.pocket.toFixed(2):'0.00',s.debt?(s.paid?'да':'НЕТ, долг'):'да'])});
  add([]);add(['ПАРТИИ']);add(['Дата','Позиция','Вариант','Штук','Товар','Км','Расход','€/л','Прочее','Итого','За штуку']);
  data.purchases.forEach(p=>add([p.date,p.name||'',p.vname||'',p.qty,(p.goods||0).toFixed(2),
    p.km||0,p.cons||'',p.fp||'',(p.trip||0).toFixed(2),p.total.toFixed(2),p.unit.toFixed(2)]));
  add([]);add(['ВЫЧЕТЫ']);add(['Дата','Конверт','На что','Сумма']);
  data.expenses.forEach(e=>add([e.date,ENVN[e.env],e.note||'',e.amount.toFixed(2)]));
  const csv='\ufeff'+L.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='fizzy-'+today()+'.csv';a.click();toast('Отчёт выгружен')}

/* ---------- хранение ---------- */
function save(){store.set('fz_data',JSON.stringify(data));pushData()}
const api=()=>`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
function led(c){$('led').className='led '+(c||'')}
async function connect(){
  cfg={owner:$('gO').value.trim(),repo:$('gR').value.trim(),path:$('gP').value.trim()||'data.json',
    branch:$('gB').value.trim()||'main',token:$('gT').value.trim()};
  if(!cfg.owner||!cfg.repo||!cfg.token)return toast('Заполните поля');
  store.set('fz_cfg',JSON.stringify(cfg));closeSheet();await pullData(true)}
async function pullData(loud){
  if(!cfg.token||!navigator.onLine)return;led('busy');
  try{const r=await fetch(api()+'?ref='+cfg.branch,{headers:{Authorization:'Bearer '+cfg.token,
      Accept:'application/vnd.github+json'},cache:'no-store'});
    if(r.status===404){sha=null;dirty=true;await pushData();if(loud)toast('Файл создан');return}
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();sha=j.sha;const L=JSON.parse(b64d(j.content));
    data={products:L.products||[],sales:L.sales||[],purchases:L.purchases||[],expenses:L.expenses||[],
      holds:L.holds||[],settings:Object.assign({},DEF,L.settings||{})};
    norm();store.set('fz_data',JSON.stringify(data));render();led('ok');if(loud)toast('Загружено')
  }catch(e){led('err');if(loud)toast('Ошибка: '+e.message)}}
async function pushData(loud){
  if(!cfg.token){if(loud)toast('Подключите GitHub');return}
  if(!navigator.onLine){dirty=true;led('err');return}
  led('busy');
  try{const body={message:'fizzy '+new Date().toISOString(),branch:cfg.branch,content:b64e(JSON.stringify(data,null,2))};
    if(sha)body.sha=sha;
    const r=await fetch(api(),{method:'PUT',headers:{Authorization:'Bearer '+cfg.token,
      Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.status===409||r.status===422){await pullSha();return pushData(loud)}
    if(!r.ok)throw new Error('HTTP '+r.status);
    sha=(await r.json()).content.sha;dirty=false;led('ok');if(loud)toast('Отправлено')
  }catch(e){dirty=true;led('err');if(loud)toast('Дошлём позже')}}
async function pullSha(){try{const r=await fetch(api()+'?ref='+cfg.branch,
  {headers:{Authorization:'Bearer '+cfg.token},cache:'no-store'});if(r.ok)sha=(await r.json()).sha}catch(e){}}
window.addEventListener('online',()=>{if(dirty)pushData()});
setInterval(()=>{if(dirty&&navigator.onLine)pushData()},30000);

function makeIcon(){try{
  const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
  if(!x)return;
  const AMBER='#f0a028',INK='#12161c',INK2='#1a2029',INK3='#232b36',LINE='#3a4552';
  function rr(ctx,x0,y0,w,h,r){ctx.beginPath();ctx.moveTo(x0+r,y0);
    ctx.arcTo(x0+w,y0,x0+w,y0+h,r);ctx.arcTo(x0+w,y0+h,x0,y0+h,r);
    ctx.arcTo(x0,y0+h,x0,y0,r);ctx.arcTo(x0,y0,x0+w,y0,r);ctx.closePath()}
  x.fillStyle=INK;rr(x,0,0,512,512,110);x.fill();
  // корпус сейфа — крупнее, почти во всю плитку
  x.fillStyle=INK2;rr(x,54,54,404,404,34);x.fill();
  x.lineWidth=9;x.strokeStyle=LINE;rr(x,54,54,404,404,34);x.stroke();
  // дверца
  x.strokeStyle=AMBER;x.lineWidth=11;rr(x,92,92,328,328,24);x.stroke();
  // петли
  x.fillStyle=LINE;
  [140,372].forEach(y=>{rr(x,40,y-30,30,60,8);x.fill()});
  // наборное колесо
  const cx=256,cy=256,R=96;
  x.beginPath();x.arc(cx,cy,R,0,Math.PI*2);x.fillStyle=INK3;x.fill();
  x.lineWidth=10;x.strokeStyle=AMBER;x.stroke();
  x.lineWidth=8;x.lineCap='round';
  for(let i=0;i<12;i++){
    const a=i*Math.PI/6,r1=R-24,r2=R-6;
    x.beginPath();
    x.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);
    x.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);
    x.stroke()}
  x.beginPath();x.arc(cx,cy,17,0,Math.PI*2);x.fillStyle=AMBER;x.fill();
  // рычаг
  x.strokeStyle=AMBER;x.lineWidth=15;x.lineCap='round';
  x.beginPath();x.moveTo(396,224);x.lineTo(396,288);x.stroke();
  const u=c.toDataURL('image/png');
  ['apple-touch-icon','icon'].forEach(r=>{const l=document.createElement('link');l.rel=r;l.href=u;document.head.appendChild(l)});
  const man={name:'FIZZY',short_name:'FIZZY',start_url:'.',display:'standalone',
    background_color:'#12161c',theme_color:'#12161c',icons:[{src:u,sizes:'512x512',type:'image/png'}]};
  const ml=document.createElement('link');ml.rel='manifest';
  ml.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/json'}));document.head.appendChild(ml)
}catch(e){}}

function init(){
  const d=store.get('fz_data');
  if(d){try{const L=JSON.parse(d);data={products:L.products||[],sales:L.sales||[],purchases:L.purchases||[],
    expenses:L.expenses||[],holds:L.holds||[],settings:Object.assign({},DEF,L.settings||{})}}catch(e){}}
  const c=store.get('fz_cfg');if(c){try{cfg=JSON.parse(c)}catch(e){}}
  norm();render();
  if(cfg.token)pullData(false);else led('')}
makeIcon();
</script>
